# Checks that can run without a phone, a GPU or a 1.8 GB model download.
#
# Deliberately narrow. The parts of this project that matter most - a model
# answering a ledger question, a GGUF loading on a Mali GPU, an APK installing -
# cannot be verified by a runner, and a green tick that implies otherwise would
# be worse than no tick at all. What CI does cover is the deterministic half:
# the hash chain, the threshold arithmetic, the locations catalogue, and whether
# both TypeScript clients still compile.
#
# The API tests need no database on purpose. Everything they exercise is pure
# functions over values, so they run in about a second and cannot fail because
# a Postgres service container was slow to come up.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    name: API — chain, thresholds, locations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # Not requirements.txt: that pulls torch and sentence-transformers, and
        # none of these tests touch a model. Keep the run under a minute.
        #
        # numpy and headless OpenCV for the photo usability checks - dark,
        # blank, blurred. They are arithmetic on pixels, not a model, so they
        # belong in CI; skipping them when cv2 is absent would leave a green
        # tick over code that never ran. Headless, because a runner has no
        # display and the full package drags in GUI libraries.
        run: pip install pytest pydantic numpy opencv-python-headless

      - name: Run tests
        working-directory: api
        run: python -m pytest tests/ -q

  web:
    name: Dashboard — typecheck and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Typecheck
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Lint
        working-directory: web
        run: npm run lint

  mobile:
    name: App — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
        working-directory: mobile

      - name: Typecheck
        # No lint step here yet: the Expo config brings its own ESLint plugin
        # set, and a half-configured one that ignores most files is worse than
        # an honest gap. tsc already catches the class of bug that has actually
        # bitten this app - a missing import, a wrong prop, a stale API shape.
        working-directory: mobile
        run: npx tsc --noEmit
